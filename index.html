<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        .container {
            text-align: center;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .joke {
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="joke" id="joke">Click the button to get a random joke!</div>
        <button onclick="getJoke()">Get a Joke</button>
    </div>

    <script>
        async function getJoke() {
            try {
                const response = await fetch('https://official-joke-api.appspot.com/jokes/random');
                const joke = await response.json();
                document.getElementById('joke').innerText = `${joke.setup} - ${joke.punchline}`;
            } catch (error) {
                document.getElementById('joke').innerText = 'Failed to fetch a joke. Please try again.';
            }
        }
    </script>
</body>
</html>
