<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🃏 Joker's Random Joke Generator 🎭</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #4a148c 0%, #7b1fa2 25%, #9c27b0 50%, #e91e63 75%, #ff5722 100%);
            margin: 0;
            overflow: hidden;
        }
        
        /* Add animated background pattern */
        body::before {
            content: '🃏 🎭 🎪 🎨 🎯 ♠️ ♥️ ♦️ ♣️ 🃏 🎭 🎪 🎨 🎯 ♠️ ♥️ ♦️ ♣️';
            position: fixed;
            top: 0;
            left: 0;
            width: 200%;
            height: 200%;
            font-size: 60px;
            opacity: 0.1;
            z-index: -1;
            animation: float 20s infinite linear;
            pointer-events: none;
        }
        
        @keyframes float {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
        
        .container {
            text-align: center;
            padding: 30px;
            background: linear-gradient(145deg, #ffffff, #f5f5f5);
            border-radius: 25px;
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.3),
                inset 0 2px 5px rgba(255, 255, 255, 0.8),
                0 0 50px rgba(156, 39, 176, 0.3);
            border: 5px solid #ffd700;
            position: relative;
            max-width: 500px;
            transform: rotate(-0.5deg);
            animation: wiggle 8s ease-in-out infinite;
        }
        
        @keyframes wiggle {
            0%, 100% { transform: rotate(-0.5deg); }
            25% { transform: rotate(0.5deg); }
            50% { transform: rotate(-0.25deg); }
            75% { transform: rotate(0.25deg); }
        }
        
        .container::before {
            content: '🎪';
            position: absolute;
            top: -20px;
            left: -20px;
            font-size: 40px;
            animation: bounce 2s ease-in-out infinite;
        }
        
        .container::after {
            content: '🎭';
            position: absolute;
            top: -20px;
            right: -20px;
            font-size: 40px;
            animation: bounce 2s ease-in-out infinite 1s;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        .joke {
            margin-bottom: 25px;
            font-size: 18px;
            color: #2e2e2e;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        button {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            font-family: 'Comic Sans MS', cursive, Arial, sans-serif;
            cursor: pointer;
            background: linear-gradient(145deg, #ff6b35, #f7931e);
            color: white;
            border: none;
            border-radius: 50px;
            box-shadow: 
                0 8px 15px rgba(0, 0, 0, 0.2),
                inset 0 2px 5px rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }
        
        button:hover {
            background: linear-gradient(145deg, #f7931e, #ff6b35);
            transform: translateY(-3px);
            box-shadow: 
                0 12px 20px rgba(0, 0, 0, 0.3),
                inset 0 2px 5px rgba(255, 255, 255, 0.4);
        }
        
        button:active {
            transform: translateY(-1px);
            box-shadow: 
                0 6px 10px rgba(0, 0, 0, 0.2),
                inset 0 2px 5px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="color: #7b1fa2; font-size: 28px; margin-top: 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.1);">🃏 Welcome to the Joker's Den! 🎭</h1>
        <div class="joke" id="joke">🎪 Ready for some laughs? Click the magical button below and let the Joker entertain you! 🎪</div>
        <button onclick="getJoke()">🎯 Surprise Me with a Joke! 🎯</button>
    </div>

    <script>
        async function getJoke() {
            // Add loading message with joker theme
            document.getElementById('joke').innerText = '🎪 The Joker is cooking up something hilarious... 🃏';
            
            try {
                const response = await fetch('https://official-joke-api.appspot.com/jokes/random');
                const joke = await response.json();
                document.getElementById('joke').innerText = `🎭 ${joke.setup} - ${joke.punchline} 🎪`;
            } catch (error) {
                document.getElementById('joke').innerText = '🃏 Oops! Even the Joker makes mistakes sometimes. Try clicking the button again for another surprise! 🎯';
            }
        }
    </script>
</body>
</html>
